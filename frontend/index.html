<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    
    <!-- Primary App Identity -->
    <title>Radha Study Hall – Operations &amp; Daily Reports</title>
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Standard Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <!-- iOS Home Screen Icons (iPhone & iPad) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Mobile & PWA Web Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Radha Study Hall" />
    <meta name="application-name" content="Radha Study Hall" />

    <!-- Suppress Netlify Injected Floating Badge & Drawer on Mobile -->
    <style>
      netlify-drawer, [data-netlify-drawer], [data-nf-variant], #netlify-badge, .netlify-badge {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          const scripts = document.querySelectorAll('script[src*="netlify/scripts/hud"]');
          scripts.forEach(function(s) { s.remove(); });
          const drawers = document.querySelectorAll('netlify-drawer, [data-netlify-drawer], [data-nf-variant], [id*="netlify"], .netlify-badge');
          drawers.forEach(function(d) {
            d.style.setProperty('display', 'none', 'important');
            d.style.setProperty('pointer-events', 'none', 'important');
            try { d.remove(); } catch(e) {}
          });
        }
        removeNetlifyBadge();
        if (window.MutationObserver) {
          var observer = new MutationObserver(removeNetlifyBadge);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(console.error);
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
